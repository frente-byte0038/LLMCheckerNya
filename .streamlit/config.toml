[theme]
base = "light"
primaryColor = "#c96a46"
backgroundColor = "#f7f2ea"
secondaryBackgroundColor = "#edf3f8"
textColor = "#203047"
linkColor = "#355b99"
font = "sans-serif"
headingFont = "serif"
codeFont = "monospace"
baseRadius = "large"
buttonRadius = "full"
borderColor = "#cfd8e3"
showWidgetBorder = true
showSidebarBorder = true

[theme.sidebar]
backgroundColor = "#f4ede4"
secondaryBackgroundColor = "#ffffff"
textColor = "#203047"
primaryColor = "#c96a46"
linkColor = "#355b99"
baseRadius = "medium"
buttonRadius = "full"
